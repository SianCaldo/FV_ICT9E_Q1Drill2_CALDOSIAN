<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q1 Drill 2</title>
    <style>
        body{
            font-family: Consolas;
            background-color: white;
        }
        header{
            text-align: center;
        }
        section{
            background-color: #fff;
            padding: 20px;
            border-radius: 12px;
            width: 600px;
            margin: auto;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        input[type="text"], select, textarea,  input[type="submit"] {
            width: 94%;
            padding: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
            text-align: center;
        }
        img{
            display: block;
            margin: auto;
            height: 140px;
            width: 140px;
            padding: 0px;
        }
        input[type="submit"]{
            width: 100%;
        }

    </style>
</head>
<body>
    <header>
        <h2>RATE A MOVIE</h2>
        <p>Rate any desired movie depending on your experience and knowledge of the content and subject.
         Answer this survey and submit.</p>
    </header>
    <br>

    <section>
        <form action="">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRBFJEX3LwSHzwP0GPzLiiPghci2h5edXBTHWhngBxi9g&s=10" alt="logo">   
      <br>
            <label for="movie">Movie Title</label>
            <br>
            <input type="text" id="movie" name="movie" placeholder="Enter here">

         <br>
            <label for="genre">Genre/s</label> 
            
            <br>
            
            <input type="checkbox" id="genre1" name="genre1">
            <label for="genre1">Action</label>
           
            <input type="checkbox" id="genre2" name="genre2">
            <label for="genre2">Romance</label>
            
            <input type="checkbox" id="genre3" name="genre3">
             <label for="genre3">Fantasy</label>
            
            <input type="checkbox" id="genre4" name="genre4">
            <label for="genre4">Horror</label>
           
            <input type="checkbox" id="genre5" name="genre5">
             <label for="genre5">Thriller</label>

            <input type="checkbox" id="genre6" name="genre6">
             <label for="genre6">Others</label>



             <br>
             <label for="rating">Rating<label>
             <br> 
            <input type="radio" id="rate1"
            name="rate">
             <label for="rate1">⭐</label>

            
            <br>
            <textarea id="review" placeholder="Write a review here..." rows="4" cols="40"></textarea>
            <br>

            <input type="submit" id="submit" 
            value="Submit Review">
                
            <a href="https://www.nyfa.edu/student-resources/9-tips-for-writing-a-film-review/" target="_blank">here</a> for the guide in making a review.

        </form> 
    </section>
				 
<!--Comment--> Made by: Sian Caldo
    <!--Reference
	Nyfa, & Nyfa. (2024, March 23). How to write a movie review: 10 essential tips. NYFA. https://www.nyfa.edu/student-resources/9-tips-for-writing-a-film-review/
-->

</body>
</html>
